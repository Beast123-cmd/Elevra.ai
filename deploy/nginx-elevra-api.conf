# Replace API_HOSTNAME, then: certbot --nginx -d API_HOSTNAME  (adds the HTTPS server block and the redirect)
server {
    listen 80;
    server_name API_HOSTNAME;

    # the mock interview uploads a PDF resume (up to 5 MB) and calls the AI, which can take a while
    client_max_body_size 8m;
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
